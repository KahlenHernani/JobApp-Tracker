<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JobApp Tracker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="logo">J</div>
      <div>
        <h1>JobApp Tracker</h1>
        <p class="sub">Save jobs while you browse</p>
      </div>
    </header>

    <form id="login-form" hidden>
      <label>Username <input id="u" autocomplete="username" required /></label>
      <label>Password <input id="p" type="password" autocomplete="current-password" required /></label>
      <button class="btn primary" type="submit">Log in</button>
    </form>

    <section id="save" hidden>
      <button id="save-btn" class="btn primary big">Save this job</button>

      <label style="margin-top:14px">Resume for cover letter <select id="resume"></select></label>
      <button id="letter-btn" class="btn big" style="margin-top:8px">Write cover letter (PDF)</button>

      <p class="hint">Open a job posting, wait for it to load, then click a button.</p>
      <div class="links">
        <button id="open-tracker" class="link" type="button">Open tracker</button>
        <button id="logout" class="link" type="button">Log out</button>
      </div>
    </section>

    <div id="status" class="status" role="status" hidden></div>

    <script src="popup.js"></script>
  </body>
</html>
